security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
            logout:
                path: app_logout

    access_control:
    - { path: ^/, roles: PUBLIC_ACCESS }

    role_hierarchy:
        ROLE_USER:
            - ROLE_LOCATION_INDEX
            - ROLE_LOCATION_SHOW
            - ROLE_MEASURMENT_INDEX
            - ROLE_MEASURMENT_SHOW
        ROLE_ADMIN:
            - ROLE_USER
            - ROLE_LOCATION_NEW
            - ROLE_LOCATION_EDIT
            - ROLE_LOCATION_DELETE
            - ROLE_MEASURMENT_NEW
            - ROLE_MEASURMENT_EDIT
            - ROLE_MEASURMENT_DELETE
