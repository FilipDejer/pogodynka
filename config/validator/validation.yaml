App\Entity\Location:
    properties:
        latitude:
            - Range:
                  min: -90
                  max: 90
                  groups: ['create', 'edit']
        longitude:
            - Range:
                  min: -180
                  max: 180
                  groups: ['create', 'edit']

App\Entity\Measurment:
    properties:
        celcius:
            - Range:
                  min: -60
                  max: 60
                  groups: ['create', 'edit']
